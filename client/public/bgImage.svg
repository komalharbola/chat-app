<svg
  width="220"
  height="220"
  viewBox="0 0 220 220"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="brandGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#0EA5A4" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Main Loop Shape -->
  <path
    d="M110 30
       C155 30 185 70 185 110
       C185 150 155 190 110 190
       C80 190 55 165 55 140
       C55 115 75 100 100 100
       C125 100 145 85 145 60
       C145 40 130 30 110 30Z"
    fill="url(#brandGradient)"
    filter="url(#softGlow)"
  />

  <!-- Inner Cut (Home / Shelter Feel) -->
  <path
    d="M110 70
       C130 70 145 90 145 110
       C145 130 130 150 110 150
       C95 150 85 140 85 125
       C85 110 95 100 110 100Z"
    fill="#020617"
  />
</svg>
